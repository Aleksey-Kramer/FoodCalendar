<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Календарь еды: градиентная плитка, лист календаря с кольцами, тарелка с вилкой и ножом -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1e1b4b" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- лист календаря -->
  <g filter="url(#shadow)">
    <rect x="76" y="108" width="360" height="328" rx="44" fill="#ffffff"/>
    <path d="M76 152a44 44 0 0 1 44-44h272a44 44 0 0 1 44 44v34H76z" fill="#312e81"/>
  </g>
  <!-- кольца -->
  <rect x="146" y="72" width="30" height="76" rx="15" fill="#ffffff" stroke="#312e81" stroke-width="10"/>
  <rect x="336" y="72" width="30" height="76" rx="15" fill="#ffffff" stroke="#312e81" stroke-width="10"/>

  <!-- тарелка -->
  <circle cx="256" cy="316" r="80" fill="url(#plate)"/>
  <circle cx="256" cy="316" r="54" fill="#fff7ed"/>
  <circle cx="256" cy="316" r="40" fill="#fde68a"/>
  <circle cx="238" cy="298" r="12" fill="#ffffff" opacity=".8"/>

  <!-- вилка -->
  <g fill="#312e81">
    <rect x="126" y="236" width="12" height="52" rx="6"/>
    <rect x="144" y="236" width="12" height="52" rx="6"/>
    <rect x="162" y="236" width="12" height="52" rx="6"/>
    <path d="M126 282h48v12c0 14-10 24-24 24s-24-10-24-24z"/>
    <rect x="141" y="312" width="18" height="86" rx="9"/>
  </g>
  <!-- нож -->
  <g fill="#312e81">
    <path d="M352 234c26 0 40 28 40 60 0 16-8 26-20 26h-20z"/>
    <rect x="352" y="312" width="18" height="86" rx="9"/>
  </g>
</svg>
